name: Supabase keep alive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    environment: github-pages-deployment
    runs-on: ubuntu-latest
    env:
      PING_TABLE: events
    steps:
      - name: Ping Supabase
        run: |
          curl --fail-with-body -sS -w "\nHTTP %{http_code}\n" \
            "${{ vars.VITE_SUPABASE_URL }}/$PING_TABLE?select=id&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_APIKEY }}" \
            -H "Authorization: Bearer ${{ vars.VITE_SUPABASE_APIKEY }}"
